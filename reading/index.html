<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var l=localStorage.getItem('ar-site-lang')||'en';document.documentElement.setAttribute('data-lang',l);document.documentElement.dir=l==='ar'?'rtl':'ltr';}catch(e){}</script>
<title>Reading Comprehension · فهم المقروء · مرافئ العربية</title>
<meta name="theme-color" content="#F6EDE1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;600;700&family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
.how{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 26px;margin:4px 0 22px;font-family:var(--kufi);color:var(--muted)}
.how span{display:inline-flex;align-items:center;gap:6px}
.how .ic-svg{color:var(--teal)}
.row{--c:var(--sc);--t:color-mix(in srgb,var(--sc) 12%,white);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.row .art{width:62px;height:70px;border-radius:31px 31px 6px 6px;background:linear-gradient(180deg,var(--b1),var(--b2));display:grid;place-items:center;font-size:1.9rem;border:1.5px solid var(--line)}
.row .ti{font-family:var(--text-ar);font-size:1.6rem;font-weight:700;color:var(--sc);line-height:1.5}
.row .te{color:var(--muted);font-family:var(--en-serif);font-style:italic;font-size:1rem}
.colh{font-size:1.4rem;margin:26px 0 10px}
.row .art .ic-svg{width:34px;height:34px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.row .btn{min-height:46px;padding:8px 16px;font-size:.98rem}
@media (max-width:620px){.row{grid-template-columns:auto 1fr}.row .acts{grid-column:1/-1}.row .acts .btn{flex:1}}
</style>
</head>
<body data-root="../">
<header id="topbar"></header>
<main class="wrap">
  <div class="phead">
    <i data-ic="lamp"></i>
    <h1><span class="t-en">Reading Comprehension</span><span class="t-ar">فهم المقروء</span></h1>
    <p><span class="t-en">Read a story, then answer questions about it and put its events in order.</span><span class="t-ar">اقرأ الحكاية، ثم أجب عن أسئلتها، ورتّب أحداثها.</span></p>
  </div>
  <div class="how"><span><i data-ic="book"></i><span class="t-en">Read</span><span class="t-ar">اقرأ</span></span><span><i data-ic="lamp"></i><span class="t-en">Answer</span><span class="t-ar">أجب</span></span><span><i data-ic="scroll"></i><span class="t-en">Order the events</span><span class="t-ar">رتّب الأحداث</span></span></div>
  <div id="list"></div>
  <div style="text-align:center"><a class="crumb" href="../index.html"><span class="t-en">Home</span><span class="t-ar">الرئيسية</span></a></div>
  <footer id="sitefoot"></footer>
</main>
<script src="../assets/site.js"></script>
<script src="../assets/stories.js"></script>
<script>
(function(){
  var S = Site;
  var lastCol = '';
  document.getElementById('list').innerHTML = STORIES.map(function(s){
    var h = s.col !== lastCol ? '<h2 class="colh"><span class="t-en">' + COLLECTIONS[s.col].en + '</span><span class="t-ar">' + S.strip(COLLECTIONS[s.col].ar) + '</span></h2>' : ''; lastCol = s.col;
    var n = S.getStars('read-' + s.id);
    return h + '<div class="row" style="--sc:' + s.c + ';--b1:' + s.bg[0] + ';--b2:' + s.bg[1] + '">' +
      '<span class="art" aria-hidden="true" style="color:' + s.c + '">' + (s.icon ? S.icon(s.icon) : s.cover) + '</span>' +
      '<div><div class="ti">' + s.ar + '</div><div class="te">' + s.en + '</div>' + (n ? S.stars(n) : '') + '</div>' +
      '<div class="acts"><a class="btn ghost" href="../stories/read.html?s=' + s.id + '">' + S.icon('book') + S.bi('Read', 'اقرأ') + '</a>' +
      '<a class="btn" style="background:var(--sc)" href="quiz.html?s=' + s.id + '">' + S.icon('lamp') + S.bi('Questions', 'الأسئلة') + '</a></div></div>';
  }).join('');
})();
</script>
</body>
</html>
