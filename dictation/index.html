<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var l=localStorage.getItem('ar-site-lang')||'en';document.documentElement.setAttribute('data-lang',l);document.documentElement.dir=l==='ar'?'rtl':'ltr';}catch(e){}</script>
<title>Dictation · الإملاء</title>
<meta name="theme-color" content="#fbf8f1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Tajawal:wght@400;500;700;800&family=Lexend:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
.unit{background:#fff;border:1.5px solid var(--line);border-radius:26px;padding:18px;margin-bottom:16px;scroll-margin-top:80px}
.unit .top{display:flex;align-items:center;gap:14px}
.unit .ic{width:60px;height:60px;border-radius:18px;background:var(--ut);color:var(--uc);display:grid;place-items:center;font-family:var(--text-ar);font-size:1.9rem;font-weight:700;flex:none}
.unit .ti{font-family:var(--text-ar);font-size:1.55rem;font-weight:700;color:var(--uc);line-height:1.5;direction:rtl}
.unit .te{color:var(--muted);font-family:var(--ui-en);font-size:1rem;font-weight:600}
.rule{margin-top:12px;background:var(--ut);border-radius:18px;padding:12px 16px}
.rule summary{cursor:pointer;font-weight:800;color:var(--uc);list-style:none}
.rule summary::-webkit-details-marker{display:none}
.rule .ar{font-size:1.3rem;line-height:2;margin:8px 0 0}
.rule .en{font-size:1.02rem;margin:8px 0 0;line-height:1.7}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;direction:rtl}
.ex span{background:#fff;border-radius:12px;padding:2px 12px;font-family:var(--text-ar);font-size:1.3rem}
.mbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.mbtns a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;border:1.5px solid var(--line);border-radius:18px;padding:10px 6px;font-weight:800;font-size:.98rem;text-align:center;transition:border-color .15s,transform .15s}
.mbtns a:hover{border-color:var(--uc);transform:translateY(-2px)}
.mbtns a .e{font-size:1.6rem}
.mbtns a .s{font-size:.85rem;letter-spacing:1px;min-height:1.2em}
.mbtns.one{grid-template-columns:1fr}
@media (max-width:520px){.mbtns a{font-size:.88rem}}
</style>
</head>
<body data-root="../">
<header id="topbar"></header>
<main class="wrap">
  <div class="phead">
    <div class="ic" aria-hidden="true">✍️</div>
    <h1><span class="t-en">Dictation (Imla’)</span><span class="t-ar">الإملاء</span></h1>
    <p><span class="t-en">Learn one spelling rule at a time, then practise it three ways: choose the spelling, find the missing letter, and listen &amp; write.</span><span class="t-ar">تعلّم قاعدة إملائية في كل مرة، ثم تدرّب عليها بثلاث طرق: اختر الكتابة الصحيحة، وأكمل الحرف الناقص، واستمع واكتب.</span></p>
  </div>
  <div id="units"></div>
  <div style="text-align:center"><a class="crumb" href="../index.html"><span class="t-en">← Home</span><span class="t-ar">الرئيسية ←</span></a></div>
  <footer id="sitefoot"></footer>
</main>
<script src="../assets/site.js"></script>
<script src="../assets/dictation.js"></script>
<script>
(function(){
  var S = Site;
  var M = [['choose', '🔎', 'Choose', 'اختر'], ['gap', '🧩', 'Missing letter', 'الحرف الناقص'], ['listen', '🎧', 'Listen & write', 'استمع واكتب']];
  document.getElementById('units').innerHTML = DICTATION.map(function(u){
    var modes = u.listenOnly ? M.slice(2) : M;
    return '<section class="unit reveal" id="' + u.id + '" style="--uc:' + u.c + ';--ut:' + u.t + '">' +
      '<div class="top"><span class="ic" aria-hidden="true">' + u.icon + '</span><div><div class="ti">' + u.ar + '</div><div class="te">' + S.esc(u.en) + '</div></div></div>' +
      '<details class="rule"' + (location.hash === '#' + u.id ? ' open' : '') + '><summary>📘 ' + S.bi('The rule', 'القاعدة') + '</summary>' +
        '<p class="ar">' + u.ruleAr + '</p><p class="en t-en">' + S.esc(u.ruleEn) + '</p>' +
        '<div class="ex">' + u.items.slice(0, 6).map(function(it){ return '<span>' + it.w + '</span>'; }).join('') + '</div></details>' +
      '<div class="mbtns' + (u.listenOnly ? ' one' : '') + '">' + modes.map(function(m){
        var n = S.getStars('dict-' + u.id + '-' + m[0]);
        return '<a href="practice.html?u=' + u.id + '&m=' + m[0] + '"><span class="e" aria-hidden="true">' + m[1] + '</span>' + S.bi(m[2], m[3]) +
          '<span class="s">' + (n ? '⭐'.repeat(n) : '') + '</span></a>';
      }).join('') + '</div></section>';
  }).join('');
  S.reveal();
})();
</script>
</body>
</html>
